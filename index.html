<meta charset="utf-8">
<title>امتحانات علم النفس</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one centered column like an exam booklet; home = exam cards, exam = one question per sheet + number grid, results = score + topic bars + review */
:root{
  --bg:#F3F6F9; --paper:#FFFFFF; --ink:#16233A; --muted:#5B6B80; --line:#D8E0EA;
  --accent:#0F6E78; --accent-soft:#E2F1F2; --mark:#F6D54A; --mark-ink:#3A2E00;
  --ok:#1E8A4C; --ok-soft:#E3F4EA; --bad:#C2372F; --bad-soft:#FBE7E5; --warn:#B7791F;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1622; --paper:#162231; --ink:#E6EDF5; --muted:#9AABBF; --line:#2A3A4E;
  --accent:#4FC0C9; --accent-soft:#16363C; --mark:#E8C93A; --mark-ink:#241C00;
  --ok:#4CC27F; --ok-soft:#173A27; --bad:#F07067; --bad-soft:#41201E; --warn:#E0A84A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1622; --paper:#162231; --ink:#E6EDF5; --muted:#9AABBF; --line:#2A3A4E;
  --accent:#4FC0C9; --accent-soft:#16363C; --mark:#E8C93A; --mark-ink:#241C00;
  --ok:#4CC27F; --ok-soft:#173A27; --bad:#F07067; --bad-soft:#41201E; --warn:#E0A84A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;margin:0}
.wrap{max-width:820px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:2rem}
h2{font-size:1.4rem}
button{font-family:inherit;font-size:1rem;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;line-height:1.15;margin:0 2px}
.rt{border-top:1.5px solid currentColor;padding:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.btn{border:0;border-radius:10px;padding:10px 20px;font-weight:600;background:var(--accent);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--muted)}

/* home */
.hero{display:grid;gap:8px;margin-bottom:24px}
.hero p{margin:0;max-width:62ch}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0;padding:0;list-style:none}
.topics li{font-size:.85rem;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;align-content:start}
.card h3{font-size:1.2rem}
.card .meta{font-size:.9rem;color:var(--muted)}
.card .last{font-size:.9rem}
.card.rand{border-style:dashed}
.part{margin-bottom:34px}
.part h2{margin-bottom:2px}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lv{font-size:.78rem;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.lv.l1{color:var(--ok);border-color:var(--ok)}
.lv.l2{color:var(--warn);border-color:var(--warn)}
.lv.l3{color:var(--bad);border-color:var(--bad)}
.howto{margin-top:28px;font-size:.95rem;color:var(--muted)}
.howto ul{margin:6px 0 0;padding-inline-start:20px}

/* exam */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar .title{font-family:var(--display);font-size:1.15rem}
.timer{font-variant-numeric:tabular-nums;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress>div{height:100%;background:var(--accent);transition:width .2s}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:.88rem;color:var(--muted)}
.qnum{font-family:var(--display);font-size:1.1rem;color:var(--ink)}
.qtext{font-size:1.12rem;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .dot{border-color:var(--accent)}
.opt.sel .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numrow input{font-family:inherit;font-size:1.2rem;width:180px;max-width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-align:center}
.hint{font-size:.85rem;color:var(--muted);margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:20px}
.grid button{height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;padding:0}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.cur{outline:3px solid var(--mark);outline-offset:1px}
.confirm{margin-top:16px;padding:14px;border-radius:12px;background:var(--bad-soft);display:grid;gap:10px}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap}

/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring b{font-family:var(--display);font-size:2.4rem;line-height:1}
.ring small{display:block;text-align:center;color:var(--muted)}
.grade{font-family:var(--display);font-size:1.5rem}
.breakdown{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:22px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{font-size:1.05rem;margin-bottom:10px}
.tb{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center;font-size:.92rem;margin-bottom:8px}
.tb .track{grid-column:1/-1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.tb .track>div{height:100%;border-radius:99px}
.tb .v{text-align:end;font-variant-numeric:tabular-nums;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.filter button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:4px 14px;font-size:.9rem}
.filter button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.rev{display:grid;gap:12px}
.ri{background:var(--paper);border:1px solid var(--line);border-inline-start:5px solid var(--ok);border-radius:12px;padding:16px}
.ri.x{border-inline-start-color:var(--bad)}
.ri .qt{margin:4px 0 10px}
.ans{display:grid;gap:4px;font-size:.95rem;margin-bottom:10px}
.ans .you.bad{color:var(--bad)}
.ans .you.good{color:var(--ok)}
.sol{background:var(--bg);border-radius:10px;padding:10px 14px;font-size:.95rem}
.sol b{color:var(--accent)}
@media (max-width:520px){
  h1{font-size:1.6rem}
  .score{grid-template-columns:1fr;justify-items:center;text-align:center}
  .sheet{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" dir="rtl" lang="ar" id="app"></div>

<script>
const TOPICS=["مفهوم الضغط والاستجابات الفيزيولوجيّة","الاستجابات السلوكيّة والعاطفيّة والإدراكيّة","نموذج المثيرات","نموذج التفاعل","المواجهة التي تتركّز في المشكلة","المواجهة التي تتركّز في المشاعر والدعم الاجتماعيّ","أسس النموّ: الوراثة، النضج والتعلّم","فرويد: مفاهيم ومراحل","فرويد: تفاصيل المراحل والانتقادات","إريكسون: المراحل 1–4","إريكسون: المراحل 5–8","بياجيه: النموّ الفكريّ"];
const PARTS=[
  {name:"الضغط ومواجهته",src:"الملفّ الأوّل (الصفحات 113–139 من الكتاب)",topics:[0,1,2,3,4,5],exams:[0,1],rand:"rand"},
  {name:"أسس في النموّ",src:"الملفّ الثاني (الصفحات 165–182 من الكتاب)",topics:[6,7,8,9,10,11],exams:[2,3],rand:"rand2"}
];
const LEVELS=["","سهل","متوسّط","متقدّم"];
/* a = index of the correct option (always 0 here, options are shuffled when the exam starts) */
const EXAMS=[
{name:"الامتحان الأوّل – الضغط",qs:[
{t:0,l:1,k:"mc",q:"من أيّ مجال استُقي مصطلح «الضغط»؟",o:["من مجال الفيزياء","من مجال الطبّ","من مجال علم الاجتماع","من مجال الاقتصاد"],s:"مصطلح الضغط مأخوذ من الفيزياء، حيث يُعرَّف على أنّه القوى الضاغطة على جسم معيّن (مثل سيارة تضغط على أخرى عند الاصطدام)."},
{t:0,l:1,k:"mc",q:"ماذا يعني مصطلح «المجابهة أو الهرب» (F.O.F) لدى كانون؟",o:["التغيّرات الجسديّة في الضغط تهيّئ الكائن إمّا لمواجهة الخطر أو للهرب منه","الإنسان يختار دائمًا الهرب من الضغط","الضغط يؤدّي دائمًا إلى العدوانيّة","التغيّرات الجسديّة في الضغط تضرّ بالكائن دائمًا"],s:"ادّعى كانون (1929) أنّ التغيّرات الفيزيولوجيّة في وضع الضغط تهدف إلى تهيئة الكائن لأحد احتمالين: المجابهة أو الهرب، مثل القطّ أمام الكلب."},
{t:0,l:2,k:"mc",q:"لماذا يصبح الوجه شاحبًا في وضع الضغط؟",o:["لأنّ الأوعية الدمويّة القريبة من الجلد تتقلّص لمنع النزيف عند الإصابة","لأنّ القلب يتوقّف عن ضخّ الدم","لأنّ الجسم يفرز الأندورفينات","لأنّ جهاز الهضم يتوقّف عن العمل"],s:"الأوعية الدمويّة المحيطيّة القريبة من الجلد تتقلّص كي تمنع حدوث نزيف لدى الإصابة، لذلك يصبح الوجه شاحبًا."},
{t:0,l:2,k:"mc",q:"في أيّ مرحلة من مراحل عارض التأقلم العامّ تكون قدرة المقاومة أعلى من المستوى الطبيعيّ؟",o:["مرحلة المقاومة","مرحلة الإنذار","مرحلة الإرهاق","في جميع المراحل بالتساوي"],s:"في مرحلة المقاومة تثبت فعاليّات الجسم وتصبح قدرته على المقاومة أكبر من قدرته في المستوى الطبيعيّ، ويتعلّم الإنسان التأقلم مع وجود عامل الضغط."},
{t:0,l:3,k:"mc",q:"أيّ ممّا يلي ليس من نواقص نموذج سيلييه؟",o:["أنّه يتجاهل الاستجابات الفيزيولوجيّة للضغط","أنّه لا يعطي وزنًا مناسبًا للعوامل النفسيّة","أنّه يتجاهل الاستجابات العينيّة (الخاصّة) لأوضاع الضغط المختلفة","أنّه لا يولي اهتمامًا لمميّزات عامل الضغط"],s:"نموذج سيلييه يتركّز بالذات في الاستجابات الفيزيولوجيّة المتشابهة. نواقصه: لا يعطي وزنًا للعوامل النفسيّة، يتجاهل الاستجابات العينيّة، ولا يهتمّ بمميّزات عامل الضغط."},

{t:1,l:1,k:"mc",q:"ما هي المشاعر المتكرّرة في حالات الضغط حسب الكتاب؟",o:["الخوف، الغضب والاكتئاب","الفرح، الفخر والحماس","الغيرة، الحبّ والشوق","الملل، الفضول والدهشة"],s:"الاستجابات العاطفيّة المتكرّرة في حالات الضغط هي مشاعر الخوف والغضب والاكتئاب."},
{t:1,l:1,k:"mc",q:"ما هي «التصاوير المفجعة»؟",o:["تخيّلات مخيفة لأسوأ السيناريوهات ترافق أوضاع الضغط","صور حقيقيّة لحوادث مؤلمة","أحلام سعيدة تساعد على تخفيف الضغط","ذكريات من الطفولة المبكرة"],s:"التصاوير المفجعة هي تخيّلات ترافق الأوضاع المخيفة، مثل المرأة التي تتخيّل حادث طرق بعد تأخّر زوجها 5 دقائق. وهي استجابة إدراكيّة للضغط."},
{t:1,l:2,k:"mc",q:"رجل خرج من بيته صباحًا ولم تشتغل سيّارته فضرب العجل بقدمه. أيّ فرضيّة يوضّح هذا المثال؟",o:["فرضيّة الإحباط–العدوانيّة","فرضيّة الانسحاب","فرضيّة التصاوير المفجعة","فرضيّة الإصغاء الانتقائيّ"],s:"حسب فرضيّة الإحباط–العدوانيّة: إذا سُدّ طريق الفرد إلى أهدافه تتطوّر لديه عدوانيّة تدفعه لإلحاق الضرر بما سبّب إحباطه."},
{t:1,l:2,k:"mc",q:"لماذا تُعتبر الكوابيس علامات حسّاسة للضغط؟",o:["لأنّ قدرتنا على كبت التصاوير المفجعة في النوم أقلّ منها في اليقظة","لأنّ الكوابيس تحدث فقط لمن مرّ بصدمة","لأنّ الدماغ يتوقّف عن العمل في النوم","لأنّ الكوابيس تزيد من ذاكرتنا"],s:"التصاوير المفجعة تبرز أكثر في الكوابيس، لأنّ قدرتنا على كبتها في الحلم أقلّ من قدرتنا في اليقظة (المراقب يعمل في الواعي)."},
{t:1,l:3,k:"mc",q:"طالبة درست جيّدًا، لكنّها في الامتحان شعرت بضغط شديد ولم تستطع تذكّر معلومات كانت تعرفها. ما اسم هذه الظاهرة وما سببها؟",o:["Black out – صعوبة استخراج معلومات مخزّنة في الذاكرة بعيدة المدى بسبب الانشغال بالتصاوير المفجعة","Black out – صعوبة نقل المعلومات من الذاكرة قصيرة المدى إلى بعيدة المدى","PTSD – اضطراب بعد صدمة","الإصغاء الانتقائيّ – التركيز في مثير واحد"],s:"المعلومات القديمة التي سبق تشفيرها في الذاكرة بعيدة المدى تصبح صعبة المنال، إذ يستصعب المنشغل بالتصاوير المفجعة استخراجها. هذه ظاهرة Black out."},

{t:2,l:1,k:"mc",q:"ما هي الميزات المشتركة لأوضاع الضغط حسب نموذج المثيرات؟",o:["العبء، الصراع، فقدان السيطرة والتغييرات","الخوف، الغضب والاكتئاب","الإنذار، المقاومة والإرهاق","الإنكار، العقلنة والاسترخاء"],s:"نموذج المثيرات يتركّز في المثيرات المؤدّية للضغط، وميزاتها المشتركة: العبء، الصراع، فقدان السيطرة، والتغييرات."},
{t:2,l:1,k:"mc",q:"حسب سلّم هولمز وراهي، أيّ حدث حصل على أعلى عدد من وحدات الضغط (100)؟",o:["موت قرين","الطلاق","السجن","الزواج"],s:"موت القرين (الزوج أو الزوجة) اعتُبر أكثر الأحداث تسبّبًا في الضغط وحصل على 100 وحدة."},
{t:2,l:2,k:"mc",q:"طفل سرق حلوى فعوقب. في المرّة التالية يريد الحلوى لكنّه يخاف العقاب. ماذا يُسمّى الميلان اللذان يُثاران فيه؟",o:["الاقتراب (أخذ الكعك) والامتناع (عدم أخذه لتجنّب العقاب)","المجابهة والهرب","الإنكار والعقلنة","الاحتواء والملاءمة"],s:"في الصراع يُثار ميلان: أخذ الكعك = الاقتراب، وعدم أخذه لتجنّب العقاب = الامتناع. كلّ اختيار له ثمن."},
{t:2,l:2,k:"num",q:"حسب سلّم هولمز وراهي: شخص تزوّج (50)، تعرّض لإصابة (53) في حادث طرق أثناء إجازة شهر العسل (13). كم وحدة ضغط جمع؟",u:"وحدة",a:116,s:"50 + 53 + 13 = 116 وحدة من التغيير خلال فترة قصيرة."},
{t:2,l:3,k:"mc",q:"في بحث جلاس وسينغر (1972) لم تستعمل المجموعة الثانية زرّ إيقاف الضجيج أبدًا، لكنّها أظهرت ضغطًا أقلّ. ماذا نستنتج؟",o:["الإيمان بقدرتنا على السيطرة مهمّ بصورة مشابهة للسيطرة نفسها حتّى لو لم نستعملها","الضجيج لا يسبّب الضغط","المجموعة الثانية سمعت ضجيجًا أقلّ","السيطرة الفعليّة هي فقط ما يقلّل الضغط"],s:"إيماننا بقدرتنا على السيطرة على أوضاع الضغط مهمّ بصورة مشابهة للسيطرة نفسها، حتّى لو لم نترجم هذه السيطرة بشكل عمليّ."},

{t:3,l:1,k:"mc",q:"من طوّر نموذج التفاعل للضغط؟",o:["ريتشارد لازاروس","هانس سيلييه","ولتر كانون","هولمز وراهي"],s:"نموذج التفاعل طوّره ريتشارد لازاروس، وهو نموذج مركّب يعتمد على النموذجين السابقين."},
{t:3,l:1,k:"mc",q:"حسب نموذج التفاعل، الضغط هو ظاهرة…",o:["غير موضوعيّة تتأثّر بتقييم الفرد للوضع","موضوعيّة متشابهة لدى جميع الناس","متعلّقة فقط بقوّة المثير","فيزيولوجيّة فقط"],s:"حسب نموذج التفاعل، الضغط ظاهرة غير موضوعيّة تتأثّر بالتقييم الذي يقوم به الفرد للوضع نفسه."},
{t:3,l:2,k:"mc",q:"هناء فُصلت من عملها لكنّها لم تشعر بالضغط لأنّها تعلم أنّها تستطيع إيجاد عمل آخر بسرعة. أيّ تقييم يوضّح المثال؟",o:["تقييم قدرة المواجهة","تقييم الوضع كمهدِّد","التقييم الفيزيولوجيّ","تقييم العبء"],s:"تقييم الوضع كمهدِّد يرتبط بمدى إيماننا بقدرتنا على مواجهته. هناء تملك المصادر للمواجهة، لذلك الوضع غير ضاغط بالنسبة لها."},
{t:3,l:2,k:"mc",q:"لماذا يشعر الطفل بالضغط في موقف معيّن أكثر من البالغ في الموقف نفسه؟",o:["لأنّ البالغ يملك أدوات لمواجهة هذا الوضع يفتقدها الطفل","لأنّ الطفل أقلّ ذكاءً","لأنّ جهاز الطفل العصبيّ لا يعمل","لأنّ الطفل لا يتعرّض للمثيرات نفسها"],s:"الأشخاص المختلفون يملكون قدرات مختلفة على المواجهة. البالغ يملك أدوات لمواجهة الوضع في حين يفتقدها الطفل."},
{t:3,l:3,k:"mc",q:"في بحث ماهل (1949) كان مستوى حامضيّة المعدة منخفضًا لدى طالبين من الثمانية. ما سبب ذلك؟",o:["أحدهما ضمن قبوله للكلّيّة والآخر لم ينوِ التعلّم أبدًا، فلم يكن الامتحان مهدِّدًا لهما","كانا أصحاب تجربة في الامتحانات","تناولا أدوية مهدّئة","درسا أكثر من الآخرين"],s:"اعتبار الوضع مهدِّدًا هو نتيجة تقييم ذاتيّ: الامتحان لم يهدّد طموح الطالبين، فأحدهما ضمن قبوله والآخر لم ينوِ التعلّم."},

{t:4,l:1,k:"mc",q:"ما هما المهارتان المركزيّتان في المواجهة المسبقة؟",o:["جمع المعلومات وتطوير خطط العمل","الإنكار والعقلنة","الاسترخاء والنشاط الجسمانيّ","الدعم العاطفيّ والدعم المادّيّ"],s:"المواجهة المسبقة تتضمّن تطوير مهارات قبل وقوع الضغط، وهناك مهارتان مركزيّتان: جمع المعلومات وتطوير خطط العمل."},
{t:4,l:1,k:"mc",q:"عامل يريد أن يطلب علاوة، فطلب من صديقه أن يقوم بدور صاحب العمل كي يتدرّب. ما اسم هذه الطريقة؟",o:["تبادل الأدوار (Role play)","العقلنة","تقييم الوضع من جديد","الإنكار"],s:"تبادل الأدوار هو أحد أشكال التدرّب على الصعوبات الممكنة ضمن المواجهة المسبقة: نشغل الأدوار في الوضع الضاغط مع شخص آخر."},
{t:4,l:2,k:"mc",q:"ما هي نقطة الانطلاق في برنامج «التطعيم النفسيّ ضدّ الضغط» لميخنباوم؟",o:["الإنسان ليس ضحيّة للضغط، بل يؤدّي دورًا فاعلًا في استجابته له","الضغط ناتج عن عوامل وراثيّة فقط","يجب تجنّب كلّ أوضاع الضغط","الأدوية هي الحلّ الأفضل للضغط"],s:"تعتمد نقطة الانطلاق على فكرة أنّ الإنسان ليس ضحيّة للضغط، إنّما يؤدّي دورًا فاعلًا في استجابته؛ طريقة تصرّفه وتفكيره قد تخفّف الضغط أو تزيده."},
{t:4,l:2,k:"mc",q:"لماذا يُعتبر جمع المعلومات عاملًا مهمًّا في مواجهة الضغط؟",o:["لأنّه يشكّل قاعدة لتطوير خطط عمل ملائمة للوضع ومتطلّباته","لأنّه يلغي الضغط تمامًا","لأنّه يغني عن الحاجة للتدريب","لأنّه يساعد على إنكار المشكلة"],s:"جمع المعلومات يشكّل قاعدة لتطوير خطط العمل الملائمة، مثل المحاضر الذي يلائم محاضرته حسب الجمهور."},
{t:4,l:3,k:"mc",q:"في بحث إغبرت (1964) طلب المرضى الذين مرّوا بمواجهة مسبقة نصف كمّيّة المسكّنات. ما التفسير الصحيح؟",o:["توفّر المعلومات المسبقة مكّنهم من الاستعداد وتحضير خطّة قلّلت تأثير الوضع الضاغط","عمليّاتهم كانت أسهل","تلقّوا أدوية أقوى","كانوا أصغر سنًّا"],s:"عند توفّر معلومات مسبقة يتمكّن الفرد من الإعداد وتحضير خطّة عمل تقلّل من تأثير الوضع الضاغط بشكل كبير."},

{t:5,l:1,k:"mc",q:"ما الفرق الأساسيّ بين المواجهة التي تتركّز في المشاعر والمواجهة التي تتركّز في المشكلة؟",o:["الأولى لا تغيّر الوضع بل تغيّر المشاعر والأفكار، والثانية تهدف لتغيير الوضع أو الهروب منه","الأولى أنجع دائمًا","الثانية تُستعمل فقط لدى الأطفال","لا يوجد فرق بينهما"],s:"المواجهة التي تتركّز في المشاعر لا تغيّر الوضع ذاته بل تغيّر مشاعرنا وأفكارنا، وتلائم أوضاعًا غير مسيطَر عليها. أمّا التي تتركّز في المشكلة فتهدف لمجابهة الوضع وتغييره أو الهروب منه."},
{t:5,l:1,k:"mc",q:"مريض سرطان يتصرّف كأنّ كلّ شيء على ما يرام ويبني برامج للمدى البعيد. أيّ حيلة دفاعيّة يستعمل؟",o:["الإنكار","العقلنة","الإعلاء","التوحّد"],s:"في الإنكار يتجاهل الشخص عامل الضغط ويتصرّف على أنّ الأمور على ما يرام، فلا تبدو منه استجابات ضغط."},
{t:5,l:2,k:"mc",q:"كيف يمكن للنشاط الجسمانيّ أن يخفّف التوتّر رغم أنّه يثير عوارض شبيهة بالضغط (نبض سريع، تعرّق)؟",o:["لأنّه إثارة إراديّة تخلق شعورًا بالسيطرة، وتطلق الأندورفين","لأنّه يمنع كلّ إثارة فيزيولوجيّة","لأنّه يعمل كدواء مهدّئ يسبّب النوم","لأنّه يجعلنا ننسى المشكلة نهائيًّا"],s:"الحاسم هو الجانب الإراديّ: التوتّر يولّد إثارة غير إراديّة، أمّا النشاط الجسمانيّ فإثارة إراديّة تخلق شعورًا بالسيطرة. كما يطلق الأندورفين الذي يخفّف الآلام."},
{t:5,l:2,k:"mc",q:"«معرفتي بأنّ آخرين قد واجهوا ما أواجهه الآن تعطيني شعورًا بعدم الوحدة». أيّ مستوى من الدعم الاجتماعيّ هذا؟",o:["المصير المشترك","الدعم المادّيّ","التزويد بالمعلومات والإرشاد","زيادة الأمان"],s:"المصير المشترك: معرفتي بأنّ آخرين واجهوا ما أواجهه تعطيني شعورًا بعدم الوحدة، وأنّ بإمكاني المواجهة كما واجه الآخرون."},
{t:5,l:3,k:"mc",q:"في بحث لازاروس وزملائه (1965) وُجّهت مجموعة لتحليل فيلم الحوادث من الناحية الفنّيّة. ما الحيلة الدفاعيّة وما النتيجة؟",o:["العقلنة – مستوى ضغط أقلّ من مجموعة المراقبة","الإنكار – مستوى ضغط أعلى من مجموعة المراقبة","العقلنة – لا فرق عن مجموعة المراقبة","الإنكار – مستوى ضغط أقلّ من مجموعة المراقبة"],s:"المجموعة الثانية وُجّهت لاستعمال العقلنة (تحليل فنّيّ). النتائج: مستوى ضغط منخفض لدى المجموعتين الأولى (إنكار) والثانية (عقلنة) أكثر من مجموعة المراقبة."}
]},
{name:"الامتحان الثاني – الضغط",qs:[
{t:0,l:1,k:"mc",q:"ما هي النماذج الثلاثة لموضوع الضغط؟",o:["نموذج الاستجابة، نموذج المثيرات، نموذج التفاعل","نموذج الإنذار، نموذج المقاومة، نموذج الإرهاق","النموذج الفيزيولوجيّ، النموذج السلوكيّ، النموذج العاطفيّ","نموذج فرويد، نموذج إريكسون، نموذج بياجيه"],s:"يميّز الكتاب بين ثلاثة نماذج: نموذج الاستجابة (داخليّ)، نموذج المثيرات (داخليّ وخارجيّ)، ونموذج التفاعل (بينهما)."},
{t:0,l:1,k:"mc",q:"ما هي مراحل «عارض التأقلم العامّ» حسب سيلييه بالترتيب؟",o:["الإنذار ← المقاومة ← الإرهاق","المقاومة ← الإنذار ← الإرهاق","الإرهاق ← الإنذار ← المقاومة","الإنذار ← الإرهاق ← المقاومة"],s:"وجد سيلييه أنّ الاستجابات موجودة في ثلاث مراحل: الإنذار، ثمّ المقاومة، ثمّ الإرهاق."},
{t:0,l:2,k:"mc",q:"ما معنى كلمة «عامّ» في مصطلح «عارض التأقلم العامّ»؟",o:["جميع الأجهزة في الجسم تشترك في عمليّة معالجة أوضاع الضغط","الضغط يصيب جميع الناس","الضغط يحدث في جميع المواقف","الاستجابة عامّة وغير واضحة"],s:"المصطلح «عامّ» يدلّ على أنّ جميع الأجهزة في الجسم تشترك في العمليّة بهدف معالجة أوضاع الضغط."},
{t:0,l:2,k:"mc",q:"لماذا تكون مرحلة الإنذار قصيرة؟",o:["لأنّها مكثّفة جدًّا وتستغلّ الطاقة للبقاء، فلا يمكن البقاء فيها زمنًا طويلًا","لأنّ الجسم لا يشعر بالخطر فيها","لأنّ قدرة المقاومة فيها أعلى من الطبيعيّ","لأنّ الجهاز الباراسيمبتاويّ لا يعمل فيها"],s:"مرحلة الإنذار مكثّفة جدًّا وتُستغلّ فيها الطاقة الموجّهة للبقاء، لذلك تقلّ قدرة المقاومة ولا يمكن البقاء فيها زمنًا طويلًا."},
{t:0,l:3,k:"mc",q:"اليوم تحدث استجابات «المجابهة أو الهرب» أيضًا عندما تصفر لنا سيّارة دون أن نحتاج لطاقة جسديّة. ما الخطر في ذلك؟",o:["تبقى إثارة جسديّة لا تجد لها منفذًا بعمل فيزيائيّ، وقد تسبّب أضرارًا جسديّة","الجسم يتوقّف عن الاستجابة للخطر الحقيقيّ","لا يوجد أيّ خطر في ذلك","نصبح أكثر عدوانيّة دائمًا"],s:"ردود الفعل هذه قد تتسبّب بأضرار جسديّة، إذ تموت إثارة جسديّة لا تجد لها منفذًا بعمل فيزيائيّ."},

{t:1,l:1,k:"mc",q:"كيف يؤثّر مستوى ضغط منخفض على الأداء حسب الكتاب؟",o:["قد يحسّن الأداء في بعض المهامّ بشرط ألّا يستمرّ فترة طويلة","يضرّ دائمًا بالأداء","لا يؤثّر على الأداء أبدًا","يسبّب شلل الاستجابات"],s:"في الدرجات المنخفضة للضغط نشعر بإثارة أعلى من المعدّل، فقد يكون أداؤنا أفضل في بعض المهامّ، بشرط ألّا يستمرّ الضغط فترة طويلة."},
{t:1,l:1,k:"mc",q:"ما معنى الاختصار PTSD؟",o:["اضطراب ما بعد الصدمة","عارض التأقلم العامّ","المجابهة أو الهرب","الإحباط والعدوانيّة"],s:"PTSD = Post Traumatic Stress Disorder، اضطراب ما بعد الصدمة، يتطوّر بعد أوضاع ضغط حادّة."},
{t:1,l:2,k:"mc",q:"أشخاص حُبسوا في بناية مشتعلة أصرّوا على الخروج من الباب الرئيسيّ ولم يفكّروا بالباب الخلفيّ. ماذا يوضّح هذا؟",o:["في الضغط يميل الإنسان لخطوات وحلول معروفة ويصعب عليه التفكير ببدائل","الخوف يحسّن التفكير الإبداعيّ","الإصغاء الانتقائيّ يتحسّن في الضغط","الناس يفضّلون الأبواب الكبيرة"],s:"إذا فشلت المحاولة الأولى يزداد الخوف، ويميل الإنسان إلى اتّخاذ خطوات وحلول معروفة، ويصعب عليه التفكير بحلول بديلة."},
{t:1,l:2,k:"mc",q:"ما هو البعد الإيجابيّ لمشاعر الخوف والاكتئاب في الضغط؟",o:["إنّها علامات تحذير تشير لنقص حاجة ضروريّة، وقد تكون دافعًا للتصرّف لتغيير الوضع","إنّها تمنع الإنسان من الشعور بالألم","إنّها تحسّن الذاكرة","لا يوجد لها أيّ بعد إيجابيّ"],s:"الخوف والاكتئاب علامات ومؤشّرات للحذر تشير لنقصان حاجة ضروريّة. الوعي لهما هو الخطوة الأولى للمواجهة، وهما دافع للتصرّف بهدف تغيير الوضع."},
{t:1,l:3,k:"mc",q:"حسب الكتاب، لماذا يستجيب بعض الناس للإحباط بالعدوانيّة وآخرون بالانسحاب؟",o:["يبدو أنّ الاستجابة للإحباط مكتسبة؛ من حقّق مبتغاه بالعدوانيّة سيكرّرها","العدوانيّة وراثيّة تمامًا","الانسحاب يحدث فقط لدى الأطفال","السبب معروف تمامًا وهو مستوى الذكاء"],s:"لا نعرف تمامًا سبب الاختلاف، لكن يبدو أنّه متعلّق بتجاربنا السابقة: الاستجابة للإحباط تُكتسب (يتمّ تعلّمها) كأيّ تصرّف آخر."},

{t:2,l:1,k:"mc",q:"ما هو السؤال الأساسيّ الذي يجيب عنه نموذج المثيرات؟",o:["لماذا يضغطنا مثير أو وضع ما؟","كيف يستجيب الجسم للضغط؟","كيف نقيّم قدرتنا على المواجهة؟","كم من الوقت يستمرّ الضغط؟"],s:"نموذج المثيرات يتركّز بماهيّة المثيرات المؤدّية إلى الضغط، فهو يجيب عن السؤال: لماذا يضغطنا مثير أو وضع ما؟"},
{t:2,l:1,k:"mc",q:"ما هو مقدار الضغط حسب ما ورد في موضوع العبء؟",o:["دمج بين قوّة المثير وفترة التعرّض له","قوّة المثير فقط","فترة التعرّض فقط","عدد المثيرات في اليوم"],s:"ما يقرّر مقدار الضغط هو دمج بين قوّة المثير وفترة تعرّضنا له."},
{t:2,l:2,k:"mc",q:"لماذا يمكن أن يسبّب الزواج أو التقدّم في العمل ضغطًا رغم أنّهما حدثان إيجابيّان؟",o:["لأنّ كلّ تغيير يتطلّب تأقلمًا من جديد مع وضع غير معروف","لأنّهما يحدثان فقط مع أحداث سيّئة","لأنّهما يسبّبان فقدان السيطرة دائمًا","لأنّ الأحداث الإيجابيّة لا تحتاج إلى تأقلم"],s:"افترض هولمز وراهي أنّ كلّ حدث يمثّل تغييرًا، وقد يتطلّب مواجهة فعّالة، أي تأقلمًا من جديد. لذلك قد تسبّب الأحداث الإيجابيّة الضغط."},
{t:2,l:2,k:"mc",q:"في بحث فايس على الفئران، أيّ فئران نقص وزنها وتعرّضت لجرح المعدة أكثر؟",o:["الفئران التي لم تستطع التحكّم بزمن الصدمة الكهربائيّة","الفئران التي استطاعت التحكّم بزمن الصدمة","الفئران التي لم تتعرّض لصدمات","لم يكن هناك فرق بين المجموعتين"],s:"زمن التجربة كان متساويًا، لكنّ الفئران التي لم تستطع التحكّم بالصدمة وشعرت بعجزها نقص وزنها بشكل ملحوظ وتعرّضت لجرح المعدة أكثر."},
{t:2,l:3,k:"mc",q:"أيّ ممّا يلي هو من نواقص سلّم هولمز وراهي؟",o:["يهمل عدم التغيّر والملل كمسبّبات للضغط","يلقي الضوء على الثمن النفسيّ لأحداث إيجابيّة","يفصّل أحداثًا ضاغطة لمعظم الناس","يمكّن من توقّع الوقوع في الضغط"],s:"من النواقص: يهتمّ بالتغيّرات المهمّة ويهمل عدم التغيّر أو الملل، يعتمد على معدّل تقديرات في بحث معيّن، ويهمل السياق الاجتماعيّ والدعم والصلابة. باقي الإجابات جوانب إيجابيّة."},

{t:3,l:1,k:"mc",q:"ما هما التقييمان اللذان يقوم بهما الفرد حسب نموذج التفاعل؟",o:["تقييم الوضع كمهدِّد وتقييم قدرة المواجهة","تقييم قوّة المثير وتقييم فترة التعرّض","تقييم الاستجابة الفيزيولوجيّة والسلوكيّة","تقييم الماضي وتقييم المستقبل"],s:"للتقييم حالتان: (أ) تقييم الوضع كمهدِّد لحاجات الفرد ودوافعه، (ب) تقييم قدرة المواجهة (التقييم الثانويّ)."},
{t:3,l:1,k:"mc",q:"ماذا يعني مصطلح «المواجهة» حسب نموذج التفاعل؟",o:["مجمل المهارات التي يستطيع الإنسان استعمالها للتغلّب على وضع الضغط","الهروب من الوضع الضاغط","إنكار وجود الضغط","الاستجابة الفيزيولوجيّة للخطر"],s:"يتطرّق مصطلح المواجهة إلى مجمل المهارات التي يستطيع الإنسان استعمالها للتغلّب على وضع الضغط."},
{t:3,l:2,k:"mc",q:"حسب روتر، من يشعر أنّه يسيطر على الوضع أكثر؟",o:["الشخص الذي يحدّد السيطرة على أنّها داخليّة","الشخص الذي يرى السيطرة خارجيّة","الشخص الذي لا يؤمن بالسيطرة","لا يوجد فرق بينهما"],s:"يدّعي روتر أنّ الشخص الذي يحدّد السيطرة على أنّها داخليّة يشعر أنّه يسيطر على الوضع أكثر ممّا يشعر بهذا شخص يرى السيطرة خارجيّة."},
{t:3,l:2,k:"mc",q:"ما هي أفضليّة نموذج التفاعل على النموذجين السابقين؟",o:["اهتمامه بالاختلافات الشخصيّة في تجربة الضغط","تركيزه في الاستجابات الفيزيولوجيّة فقط","تركيزه في المثيرات الموضوعيّة فقط","أنّه يقيس الضغط بالأرقام"],s:"تظهر أفضليّة نموذج التفاعل باهتمامه بالاختلافات الشخصيّة، ونستطيع من خلاله التنبّؤ بالضغط إذا توفّرت معلومات عن حاجات الفرد وقدرته على المواجهة."},
{t:3,l:3,k:"mc",q:"أيّ تعريف يدمج النماذج الثلاثة للضغط؟",o:["استجابات نفسيّة وفيزيولوجيّة تحدث نتيجة حدث يهدّد دوافع وحاجات ضروريّة لدى الفرد ويحدّ من قدرته على المواجهة","استجابة عامّة وواحدة للجسم لكلّ طلب يُطلب منه","دمج بين قوّة المثير وفترة التعرّض له","وضع يكون فيه الإنسان في صراع بين ميلين"],s:"التعريف المشترك: الضغط طريقة استجابات نفسيّة وفيزيولوجيّة تحدث نتيجة لحدث معيّن يهدّد دوافع وحاجات ضروريّة لدى الفرد ويحدّ من قدرته على المواجهة. (التعريف الثاني هو تعريف سيلييه فقط)."},

{t:4,l:1,k:"mc",q:"ما هي مراحل برنامج التطعيم النفسيّ ضدّ الضغط بالترتيب؟",o:["التعريف من جديد ← اكتساب المهارات والتدرّب ← التطبيق","التطبيق ← التعريف من جديد ← اكتساب المهارات","الإنذار ← المقاومة ← الإرهاق","جمع المعلومات ← الإنكار ← الاسترخاء"],s:"يتضمّن البرنامج ثلاث مراحل: (أ) التعريف من جديد، (ب) اكتساب مهارات وتدرّب، (ج) التطبيق."},
{t:4,l:1,k:"mc",q:"متى تلائم المواجهة التي تتركّز في المشكلة؟",o:["في الأوضاع التي يستطيع الإنسان السيطرة عليها أو تغييرها أو الانسحاب منها","في الأوضاع غير المسيطَر عليها كحوادث الطرق","فقط بعد انتهاء الضغط","فقط لدى الأطفال"],s:"المواجهة التي تتركّز في المشكلة تلائم الأوضاع التي يستطيع الإنسان السيطرة عليها وتغييرها أو الانسحاب منها."},
{t:4,l:2,k:"mc",q:"شخص لا يستطيع رفض طلبات الآخرين. كيف تُعرَّف مشكلته في مرحلة «التعريف من جديد»؟",o:["فقدان لمهارة الحزم وليس فشلًا","فشل شخصيّ لا يمكن علاجه","اضطراب ما بعد الصدمة","نقص في الذكاء"],s:"وظيفة المعالِج مساعدة المعالَج في تحليل المشكلة ليس باعتبارها فشلًا، بل كافتقار لمهارة معيّنة؛ هنا فقدان مهارة الحزم (Steadiness)."},
{t:4,l:2,k:"mc",q:"طالب عليه تقديم وظيفة وامتحان في الأسبوع نفسه، ففحص كم بقي له من الوقت وقسّمه بين الواجبين. أيّ طريقة مواجهة يستعمل؟",o:["التدرّب على حلّ المشاكل (تحليل عقلانيّ للوضع)","الإنكار","تقييم الوضع من جديد","الاسترخاء"],s:"في حلّ المشاكل نحدّد الهدف ونحلّل الوضع عقلانيًّا ونتّخذ قرارات ناجعة. هذه الطريقة ناجعة لأنّها تهاجم عامل الضغط."},
{t:4,l:3,k:"mc",q:"في أيّ مرحلة من برنامج ميخنباوم يتمّ تطوير «أقوال ذاتيّة إيجابيّة» وتمييز علامات التصرّف غير المتأقلم؟",o:["مرحلة اكتساب المهارات والتدرّب","مرحلة التعريف من جديد","مرحلة التطبيق","مرحلة الإنذار"],s:"أحد المركّبات الهامّة في مرحلة اكتساب المهارات والتدرّب هو تطوير أقوال إيجابيّة، وتعلّم تمييز العلامات الدالّة على تصرّف غير متأقلم وتشغيل أفكار إيجابيّة."},

{t:5,l:1,k:"mc",q:"ما هي أساليب التهدئة الثلاثة التي وردت في الكتاب؟",o:["العلاج بالدواء، النشاط الجسمانيّ، الاسترخاء","الإنكار، العقلنة، الإعلاء","جمع المعلومات، تبادل الأدوار، حلّ المشاكل","الدعم العاطفيّ، الدعم المادّيّ، المصير المشترك"],s:"الأساليب الثلاثة التي تخلق «سكينة» جسديّة: العلاج بواسطة الدواء، النشاط الجسمانيّ، والاسترخاء."},
{t:5,l:1,k:"mc",q:"ما هي الحيلة الدفاعيّة التي لا تنكر الواقع، بل تصدّ الإثارة العاطفيّة عن الوعي وينشغل فيها المرء بالأبعاد المنطقيّة؟",o:["العقلنة","الإنكار","النكوص","الإعلاء"],s:"العقلنة لا تنكر الواقع، إنّما تصدّ الإثارة العاطفيّة عن الوعي، مثل الطبيب في الحرب الذي ينفصل عن مشاعره ليعالج المصابين."},
{t:5,l:2,k:"mc",q:"ما هما المشكلتان في تناول الأدوية المهدّئة لفترة طويلة؟",o:["العوارض الجانبيّة ومنها الإدمان، ومنع تعلّم مهارات للسيطرة على الأحداث الضاغطة","زيادة الإثارة الفيزيولوجيّة وزيادة الخوف","فقدان الذاكرة وفقدان البصر","لا توجد أيّ مشاكل"],s:"تناول المهدّئات لفترة طويلة قد يؤدّي إلى: (1) العوارض الجانبيّة ومنها الإدمان، (2) منع الإنسان من تعلّم واكتساب مهارات تساعده في السيطرة على الحوادث الضاغطة."},
{t:5,l:2,k:"mc",q:"في بحث لانجر (1975)، مرضى وُجّهوا للنظر إلى الجانب الإيجابيّ للعمليّة. ماذا كانت النتيجة؟",o:["طلبوا ثلث كمّيّة الدواء المسكّن وغادروا المستشفى قبل مجموعة المراقبة","طلبوا كمّيّة أكبر من الدواء","لم يكن هناك فرق بين المجموعتين","رفضوا إجراء العمليّة"],s:"مرضى مجموعة التجربة طلبوا ثلث كمّيّة الدواء المسكّن التي طلبتها مجموعة المراقبة، وغادروا المستشفى قبلهم. تقييم الوضع من جديد يساعد أيضًا على مواجهة الوجع ويعجّل الشفاء."},
{t:5,l:3,k:"mc",q:"لماذا يفضّل الأطبّاء غالبًا مواجهة مريض السرطان الذي ينكر مرضه بالحقيقة؟",o:["لأنّ الإنكار قد يسبّب رفضه للعلاج، وتلقّي العلاج أفضل من تخفيف حدّة الضغط","لأنّ الإنكار يزيد الضغط دائمًا","لأنّ الحيل الدفاعيّة ممنوعة طبّيًّا","لأنّ المريض لا يشعر بأيّ ضغط"],s:"الإنكار يساعد المريض على مواجهة الضغط، إلّا أنّه قد يتسبّب في رفضه العلاج، لذا يفضّل الأطبّاء مواجهته بالحقيقة؛ فتلقّي العلاج يبقى أفضل من التخفيف من حدّة الضغط."}
]},
{name:"الامتحان الأوّل – النموّ",qs:[
{t:6,l:1,k:"mc",q:"ماذا يدرس علم نفس النموّ؟",o:["سلوك الإنسان من بداية تكوينه كجنين في الرحم وحتّى الممات","سلوك الأطفال فقط","الأمراض النفسيّة لدى البالغين","نموّ الجسم فقط"],s:"علم نفس النموّ يدرس سلوك الإنسان من بداية تكوينه كجنين في الرحم وحتّى الممات، في كلّ مجالات النموّ وكلّ مراحله."},
{t:6,l:1,k:"mc",q:"ماذا نقصد بمصطلح «البيئة» في موضوع النموّ؟",o:["الخبرات التي يمرّ بها الإنسان","الجينات التي يرثها من والديه","المكان الجغرافيّ الذي يعيش فيه فقط","الكروموسومات في الخليّة"],s:"بمصطلح البيئة نقصد الخبرات التي يمرّ بها الإنسان، أمّا الوراثة فهي الجينات التي نأخذها عن والدينا."},
{t:6,l:2,k:"mc",q:"ما الفرق بين النضج والكِبَر؟",o:["النضج يمكّن من وظائف جديدة لم تكن ممكنة، والكِبَر زيادة كمّيّة في حجم الأعضاء","لا فرق بينهما","الكِبَر يؤدّي دائمًا إلى النضج","النضج يتأثّر بالبيئة أكثر من الكِبَر"],s:"النضج مرحلة نموّ الخلايا التي بها تتحقّق وظائف جديدة. الكِبَر نموّ بيولوجيّ كمّيّ (طول الأطراف، الوزن)، ولا يؤدّي بالضرورة إلى النضج."},
{t:6,l:2,k:"mc",q:"كلّ الأطفال ينضجون لتعلّم الكلام بنفس العمر، لكنّ أطفال القوميّات المختلفة يتعلّمون لغات مختلفة. ماذا يوضّح ذلك؟",o:["النضج يمكّن من لفظ الكلمات، والتعلّم (البيئة) يحدّد أيّ لغة","اللغة تتحدّد بالوراثة فقط","التعلّم لا يؤثّر على النموّ","النضج يحدّد اللغة التي سيتكلّمها الطفل"],s:"النضج يمكّن الطفل من لفظ ألفاظ كثيرة، لكنّ التعلّم يشجّعه على لفظ ألفاظ لغة الأمّ فقط. التعلّم عامل بيئيّ يؤثّر على النموّ."},
{t:6,l:3,k:"mc",q:"في تجربة جيزيل وتومسون، لماذا تعلّمت الطفلة «ب» التسلّق خلال أسبوعين فقط، بينما احتاجت «أ» ستّة أسابيع؟",o:["لأنّ «ب» كانت أكبر عند بدء التدريب، وبالتالي ناضجة للقيام بهذه المهارة","لأنّ «ب» أذكى وراثيًّا","لأنّ «ب» تدرّبت وقتًا أطول يوميًّا","لأنّ «أ» توقّفت عن التدريب"],s:"التعليل: «ب» كانت أكبر عند بدء التدريب، وبالتالي ناضجة للقيام بهذه المهارة. لهذا يشدّد الباحثون على أهمّيّة النضج كأساس ويليه التعلّم."},

{t:7,l:1,k:"mc",q:"ما اسم الطاقة الغريزيّة التي تحدّث عنها فرويد في البداية؟",o:["الليبيدو (الطاقة الشبقيّة)","ثاناتوس","السكيما","الأندورفين"],s:"تحدّث فرويد في البداية عن طاقة غريزيّة أساسيّة واحدة دعاها Libido (الطاقة الشبقيّة)."},
{t:7,l:1,k:"mc",q:"ما هي المرحلة الأولى من مراحل النموّ النفسيّ الجنسيّ حسب فرويد؟",o:["المرحلة الفميّة","المرحلة الشرجيّة","المرحلة القضيبيّة","مرحلة الكمون"],s:"المراحل حسب فرويد: الفميّة (0–1.5)، الشرجيّة (1.5–3)، القضيبيّة (3–6)، الكمون (6–12)، التناسليّة (12 وما بعد)."},
{t:7,l:2,k:"mc",q:"ما الفرق بين «الثبات» (Fixation) و«النكوص» (Regression) حسب فرويد؟",o:["الثبات = البقاء في مرحلة بسبب صعوبات كبيرة فيها؛ النكوص = العودة لمرحلة سابقة نجحنا بها","الثبات = الانتقال للمرحلة التالية؛ النكوص = البقاء في المرحلة","كلاهما يعني النجاح في المرحلة","الثبات يحدث فقط في الشيخوخة"],s:"صعوبات كبيرة في مرحلة ما قد تُبقي الإنسان في حالة ثبات فيها. والنكوص مخرج آخر للأزمات: العودة إلى الوراء لمرحلة سابقة نجحنا بها فنشعر بالارتياح."},
{t:7,l:2,k:"mc",q:"ماذا تُسمّى المنطقة في الجسم المسؤولة عن المتعة في كلّ مرحلة حسب فرويد؟",o:["المنطقة الإيروجينيّة","المنطقة الحسّيّة الحركيّة","منطقة الإعلاء","منطقة الكمون"],s:"يقول فرويد إنّه في كلّ مرحلة توجد منطقة مختلفة بالجسم مسؤولة عن إشباع المتعة الغريزيّة، دعاها المنطقة الإيروجينيّة."},
{t:7,l:3,k:"mc",q:"في المرحلة الفميّة، المتعة الأولى (المصّ) تعبّر عن…، والمتعة اللاحقة (العضّ والبصق) تعبّر عن…",o:["عدم الفعاليّة والاتّكاليّة؛ العدائيّة والفعاليّة","العدائيّة؛ الاتّكاليّة","الاستقلاليّة؛ الخجل","الثقة؛ عدم الثقة"],s:"المتعة الأولى تعبّر عن عدم الفعاليّة في الشخصيّة (Passive) الاتّكاليّة وتعلّق الطفل بوالديه، أمّا المتعة اللاحقة فتعبّر عن العدائيّة الفعّالة (Active)."},

{t:8,l:1,k:"mc",q:"ماذا يُسمّى إعطاء الطفل بديلًا مقبولًا للعب بالموادّ القذرة (مثل ألوان الأصابع والعجينة والرمل)؟",o:["الإعلاء (Sublimation)","الإنكار","النكوص","الاحتواء"],s:"في المرحلة الشرجيّة يتعلّم الطفل ألّا يلعب بالموادّ القذرة، بل نعطيه بديلًا لهذه المتعة = الإعلاء."},
{t:8,l:1,k:"mc",q:"كيف يُحلّ صراع أوديب حسب فرويد؟",o:["بالتوحّد مع الوالد من نفس الجنس","بالتوحّد مع الوالد من الجنس الآخر","بالانفصال عن الوالدين","بالنكوص للمرحلة الفميّة"],s:"يشعر الطفل باستحالة تحقيق أمنيته فيختار أن يصبح مثل والده من نفس جنسه، فتنحلّ العقدة وتتبدّل بالتوحّد/التضامن (Identification)."},
{t:8,l:2,k:"mc",q:"أيّ مجموعة صفات تميّز «الشخصيّة الشرجيّة» حسب فرويد؟",o:["التشديد على النظافة والنظام، العناد، الدقّة، حبّ الامتلاك والبخل","التفاؤل والرضى عن النفس","الاتّكاليّة ومصّ الإصبع والتدخين","الفضول والمبادرة"],s:"النمط الأناليّ يميل إلى التشديد على النظافة والنظام، العناد، الدقّة، حبّ الامتلاك والبخل، أو الكرم الزائد."},
{t:8,l:2,k:"mc",q:"ماذا وجد مالينوفسكي في دراسته لأطفال الجزر حيث الشخصيّة المسيطرة في العائلة هي الخال؟",o:["أحلام الأطفال كانت ضدّ الخال وليس ضدّ الأب","أحلام الأطفال كانت ضدّ الأب فقط","الأطفال لم يحلموا أبدًا","الأطفال توحّدوا مع الخال منذ الولادة"],s:"وجد مالينوفسكي أنّ أحلام الأطفال ضدّ الخال وليس ضدّ الأب، ممّا يؤكّد أنّ عقدة أوديب على خلفيّة صراع قوى (سلطة) وليس على خلفيّة جنسيّة."},
{t:8,l:3,k:"mc",q:"أمّ تشجّع ابنها على قضاء حاجته في الحمّام، فيفعل ذلك مباشرة بعد خروجه منه. حسب فرويد، ما الذي قد يفسّر سلوكه؟",o:["معاملة قاسية في تدريب النظافة جعلته يعبّر عن غضبه بالعناد و«بالضدّ»","نضج زائد في المرحلة الفميّة","حلّ ناجح لصراع أوديب","الإعلاء"],s:"إذا عاملنا الطفل بقسوة وعاقبناه بشدّة كلّما فشل، يعبّر هؤلاء الأطفال عن غضبهم بالعناد والمضايقة و«بالضدّ»، فيعملون كلّ شيء بالعكس."},

{t:9,l:1,k:"mc",q:"كم مرحلة أساسيّة في نظريّة إريكسون؟",o:["ثماني مراحل","خمس مراحل","أربع مراحل","ستّ مراحل"],s:"يقسم إريكسون دورة حياة الإنسان إلى ثماني مراحل أساسيّة، عامّة ومشتركة لجميع الناس باختلاف أصلهم وحضارتهم."},
{t:9,l:1,k:"mc",q:"ما هو الصراع في المرحلة الأولى (0–1.5) حسب إريكسون؟",o:["الثقة الأساسيّة مقابل عدم الثقة","الاستقلاليّة مقابل الشكّ والعار","المبادرة مقابل الذنب","الاجتهاد مقابل النقص"],s:"المرحلة الأولى: الثقة الأساسيّة مقابل عدم الثقة، وفيها يتعلّم الطفل أن يثق أو لا يثق بأمّه أو بالشخصيّة المركزيّة في حياته."},
{t:9,l:2,k:"mc",q:"أمّ تتجاهل بكاء رضيعها أحيانًا، وتستجيب له أحيانًا أخرى متأخّرة. ماذا قد ينتج عن ذلك حسب إريكسون؟",o:["ينشأ الطفل فاقدًا للثقة الأساسيّة","ينشأ الطفل مستقلًّا جدًّا","يصبح الطفل مبادرًا","لا يؤثّر ذلك على الطفل"],s:"إذا تجاهلت الأمّ بكاء ابنها واستجابت له في بعض الأحيان فقط وتأخّرت، فإنّه ينشأ فاقدًا للثقة الأساسيّة."},
{t:9,l:2,k:"mc",q:"طفل في الرابعة يكثر من أسئلة «كيف؟» و«لماذا؟». كيف يفسّر إريكسون هذا الفضول على خلاف فرويد؟",o:["جزء من مبادرة الطفل العامّة للتعرّف على العالم","اهتمام جنسيّ فقط","علامة على الشعور بالذنب","علامة على عدم الثقة"],s:"على خلاف فرويد الذي يتركّز بالفضول الجنسيّ، يرى إريكسون الفضول للتعرّف على العالم كجزء من مبادرة الطفل العامّة في تعامله مع الأشياء المحيطة."},
{t:9,l:3,k:"mc",q:"أيّ تصرّف من المعلّمة في الصفّ الأوّل يقتل «روح الاجتهاد» حسب إريكسون؟",o:["الإكثار من انتقاد الطفل وإهانته بالفشل ومعاقبته","تعزيز نجاح الطفل","إعطاء مهامّ مناسبة لقدراته","تشجيعه على المحاولة ثانية إذا فشل"],s:"إذا أكثرنا من انتقاد الطفل وإشعاره بالفشل بالكلام ومعاقبته، نقتل روح الاجتهاد ونشعره بأنّه أقلّ من زملائه، فيشعر بالنقص."},

{t:10,l:1,k:"mc",q:"ما هو الصراع في مرحلة المراهقة (12–18) حسب إريكسون؟",o:["تحديد الهويّة مقابل تشتّت الدور","التآلف مقابل العزلة","الاجتهاد مقابل النقص","تكامل الذات مقابل اليأس"],s:"المرحلة الخامسة (12–18): تحديد الهويّة مقابل تشتّت الدور."},
{t:10,l:1,k:"mc",q:"ما هو الصراع في جيل الشيخوخة حسب إريكسون؟",o:["تكامل الذات والرضى عن النفس مقابل الشعور باليأس","التوالد مقابل الجمود","التآلف مقابل العزلة","الثقة مقابل عدم الثقة"],s:"المرحلة الثامنة (جيل الشيخوخة): تكامل الذات والرضى عن النفس مقابل الشعور باليأس."},
{t:10,l:2,k:"mc",q:"ليلى تكتب بثلاثة خطوط مختلفة وتقول: «كيف أكتب بخطّ واحد طالما أنّني لا أعرف من أنا؟». ماذا يوضّح هذا المثال؟",o:["تشتّت الدور","الثقة الأساسيّة","التآلف","تكامل الذات"],s:"تشعر ليلى بالضياع وتشتّت الدور، وهذا ما يسمّيه إريكسون بتوزيع الهويّة."},
{t:10,l:2,k:"mc",q:"لماذا تُسمّى المرحلة السابعة أيضًا «مرحلة الإنتاج»؟",o:["لأنّها تشمل العطاء بكلّ ميادين الحياة – العمل، التربية، الفنون – وليس فقط إنجاب الأطفال","لأنّ الإنسان يعمل فيها ساعات أكثر","لأنّها تتعلّق بالإنتاج الاقتصاديّ فقط","لأنّ الإنسان يصبح فيها مستقلًّا"],s:"تُسمّى مرحلة الإنتاج لأنّها تشمل العطاء بكلّ ميادين الحياة: العمل، التربية، الفنون، وليس فقط إنجاب الأطفال وتربيتهم."},
{t:10,l:3,k:"mc",q:"حسب إريكسون، ما الخطر في الانتهاء المبكر (المتسرّع) لعمليّة تكوين الهويّة؟",o:["يُثبّت صورة مبكرة للذات كان بالإمكان تطويرها إلى إمكانيّات أوسع","يؤدّي إلى تشتّت الدور الدائم","يمنع الإنسان من الزواج","لا يوجد أيّ خطر في ذلك"],s:"يقول إريكسون إنّ الانتهاء المبكر لعمليّة تكوين الهويّة يثبّت صورة مبكرة كان بالإمكان تطويرها إلى إمكانيّات أوسع لتحقيق الذات. وعلى النقيض، الإطالة المبالغ بها قد تعيق الوصول إلى قرار."},

{t:11,l:1,k:"mc",q:"ما هي الصورة الذهنيّة (السكيما) حسب بياجيه؟",o:["وحدة معلومات أساسيّة تُحفظ بها معرفتنا للعالم في العقل","مرحلة من مراحل النموّ","حيلة دفاعيّة","نوع من أنواع الذكاء"],s:"يفترض بياجيه أنّ معرفتنا للعالم تُحفظ في عقلنا كصور ذهنيّة سمّاها سكيما، والصورة الذهنيّة هي وحدة معلومات أساسيّة."},
{t:11,l:1,k:"mc",q:"ما هي المرحلة الأولى من مراحل النموّ الفكريّ حسب بياجيه؟",o:["المرحلة الحسّيّة – الحركيّة","مرحلة ما قبل العمليّات الذهنيّة","مرحلة العمليّات الذهنيّة الواقعيّة","مرحلة العمليّات الذهنيّة المجرّدة"],s:"المراحل حسب بياجيه: الحسّيّة الحركيّة (0–1.5)، ما قبل العمليّات (1.5–7)، العمليّات الواقعيّة (7–12)، العمليّات المجرّدة (12 فما فوق)."},
{t:11,l:2,k:"mc",q:"طفل يعرف الكلب فقط، رأى قطّة فناداها «عو». أيّ عمليّة يوضّح هذا المثال؟",o:["الاحتواء – تغيير المادّة المستوعبة لتوافق الصورة الذهنيّة القائمة","الملاءمة – تغيير الصورة الذهنيّة لتوافق المادّة","الإعلاء","النكوص"],s:"الطفل يعدّل ما يشاهده ويشوّش الصورة الحقيقيّة في سبيل احتوائها ضمن سكيما الكلب الموجودة لديه. هذا احتواء."},
{t:11,l:2,k:"mc",q:"لماذا يعتبر بياجيه أنّ ذكاء الطفل في المرحلة الحسّيّة الحركيّة هو ذكاء سلوكيّ وليس فكريًّا؟",o:["لأنّه يعتمد على الحسّ والحركة بدلًا من التمثيل الرمزيّ الداخليّ للعالم","لأنّ الطفل لا يملك أيّ ذكاء","لأنّ الطفل يتكلّم بطلاقة","لأنّ الطفل يفكّر بمفاهيم مجرّدة"],s:"يعتمد ذكاء الأطفال في هذه المرحلة على الحسّ والحركة بدلًا من التمثيل الرمزيّ الداخليّ للعالم، لذلك يعتبره بياجيه ذكاءً سلوكيًّا."},
{t:11,l:3,k:"mc",q:"حسب بياجيه، ما هو الأساس الأوّل الذي يحثّ على الاكتشاف والازدهار الفكريّ؟",o:["التوتّر الناجم عن حالة عدم التوازن بين المثير الجديد والصور الذهنيّة القائمة","التدعيم والمكافأة","الوراثة فقط","تقليد الوالدين"],s:"عدم التوافق بين المثير الجديد والقديم يثير حالة عدم توازن تسبّب التوتّر، فيسعى الإنسان لحلّه. يعتبر بياجيه هذا التوتّر الأساس الأوّل للاكتشاف، أمّا التدعيم فهو أقلّ أهمّيّة بنظره."}
]},
{name:"الامتحان الثاني – النموّ",qs:[
{t:6,l:1,k:"mc",q:"ما هو «التعلّم» حسب الكتاب؟",o:["تغيّر ثابت في السلوك يحدث نتيجة خبرة","نموّ الخلايا الذي يمكّن من وظائف جديدة","زيادة في طول الأطراف والوزن","صفات نأخذها عن والدينا"],s:"التعلّم هو تغيّر ثابت في السلوك يحدث نتيجة خبرة، أي أنّه عامل بيئيّ يؤثّر على نموّ الإنسان."},
{t:6,l:1,k:"mc",q:"ما هو الإدراك المقبول اليوم حول دور الوراثة والبيئة؟",o:["أغلب الصفات السلوكيّة تتشكّل بواسطة الوراثة والبيئة معًا","كلّ الصفات تتحدّد بالوراثة فقط","كلّ الصفات تتحدّد بالبيئة فقط","الوراثة والبيئة لا تؤثّران على السلوك"],s:"الإدراك المقبول اليوم: أغلب الصفات السلوكيّة تتشكّل بواسطة الوراثة والبيئة معًا، والسؤال هو وزن كلّ من هذه العوامل."},
{t:6,l:2,k:"mc",q:"أهل يدرّبون ابنهم على المشي قبل أن تنضج عضلاته وأعصابه. ماذا قد يحدث حسب الكتاب؟",o:["قد يخيب أملهم ويسبّبون لابنهم شعورًا بالفشل","سيمشي الطفل أسرع بكثير","سينضج الطفل مبكرًا","لن يؤثّر ذلك أبدًا"],s:"النضج شرط مسبق وأساسيّ للتعلّم. الأهل الذين يدرّبون ابنهم قبل نضوج أعضائه قد يخيب أملهم وقد يسبّبون له شعورًا بالفشل."},
{t:6,l:2,k:"mc",q:"ما الصحيح بالنسبة لتسلسل مراحل النموّ؟",o:["التسلسل ثابت وعامّ لجميع الأطفال، لكن هناك فروق فرديّة في العمر","التسلسل مختلف من طفل لآخر","كلّ الأطفال يصلون للمراحل بنفس العمر بالضبط","لا يوجد تسلسل للمراحل"],s:"نلاحظ تسلسلًا ثابتًا للمراحل (نجلس قبل أن نمشي، نعدّ قبل أن نفهم مفهوم العدد)، وهو عامّ لجميع الأطفال، لكن هناك فروق فرديّة بالعمر."},
{t:6,l:3,k:"mc",q:"ما هو الاعتراض على الاستنتاج من تجربة جيزيل وتومسون؟",o:["الطفلة «ب» لم تتدرّب على التسلّق، لكنّها قامت بخبرات مشابهة كالزحف ساعدتها","التوأمتان لم تكونا متشابهتين وراثيًّا","التجربة استمرّت وقتًا قصيرًا جدًّا","الطفلة «أ» كانت مريضة"],s:"الاعتراض: حقًّا الطفلة «ب» لم تتدرّب على التسلّق، إلّا أنّها قامت بخبرات مشابهة كالزحف ممّا ساعدها في الوصول إلى مهارة التسلّق أسرع."},

{t:7,l:1,k:"mc",q:"ما هما الغريزتان الأساسيّتان في نظريّة فرويد المعدّلة؟",o:["إيروس (غريزة الحياة) وثاناتوس (غريزة الموت)","الليبيدو والسكيما","الأنا والهوَ","الاحتواء والملاءمة"],s:"عدّل فرويد نظريّته لتشمل غريزتين أساسيّتين: إيروس (Eros) غريزة الحبّ/الحياة، وثاناتوس (Thanatos) غريزة الهدم/الموت."},
{t:7,l:1,k:"mc",q:"ما هي منطقة المتعة في المرحلة الشرجيّة (1.5–3)؟",o:["فتحة الشرج (السيطرة على تحرير العضلات)","الفم","أعضاء التناسل","لا توجد منطقة متعة"],s:"منطقة المتعة في المرحلة الشرجيّة هي فتحة الشرج؛ يشعر الطفل بمتعة السيطرة على تحرير عضلات فتحة الشرج."},
{t:7,l:2,k:"mc",q:"ماذا يميّز مرحلة الكمون (6–12) حسب فرويد؟",o:["يهدأ الاهتمام بالمتعة الغريزيّة، ويتاح مجال أكبر للنشاط الفكريّ والاجتماعيّ","يبدأ صراع أوديب","يبدأ تدريب النظافة","يعود الاهتمام بالجنس الآخر"],s:"في مرحلة الكمون يهدأ اهتمام الطفل بالمتعة الغريزيّة، وهي فترة هدوء بين مرحلتين حادّتين، تتيح مجالًا أكبر للنشاط الفكريّ والاجتماعيّ."},
{t:7,l:2,k:"mc",q:"في أيّ مرحلة يبدأ الطفل بالانتباه إلى «مبدأ الواقع» بعد أن كان يعتمد على «مبدأ المتعة» فقط؟",o:["المرحلة الشرجيّة","المرحلة الفميّة","مرحلة الكمون","المرحلة التناسليّة"],s:"في المرحلة الشرجيّة يبدأ الانتباه إلى متطلّبات الواقع (مبدأ الواقع): يتعلّم الطفل الحاجة لأوان معيّن. قبل ذلك اعتمد على مبدأ المتعة فقط."},
{t:7,l:3,k:"mc",q:"حسب فرويد، كيف يمكن توجيه الطاقة الغريزيّة لدى المراهق في المرحلة التناسليّة؟",o:["إلى تحدّيات كثيرة بنّاءة اجتماعيًّا وفكريًّا","إلى العودة للمرحلة الفميّة","إلى التوحّد مع الوالد من الجنس الآخر","لا يمكن توجيهها"],s:"في المرحلة التناسليّة يمكن توجيه الطاقة الغريزيّة لدى المراهق إلى تحدّيات كثيرة بنّاءة اجتماعيًّا وفكريًّا بدلًا من أن ينحصر انشغاله في الناحية الجنسيّة."},

/* ---------- helpers ---------- */
function fmt(s){
  s=String(s).replace(/</g,"&lt;").replace(/\\cdot/g,"·").replace(/\\neq/g,"≠").replace(/\\approx/g,"≈")
    .replace(/\\%/g,"%").replace(/\\angle\s?/g,"∠").replace(/\^2/g,"²").replace(/\\sqrt\{([^}]+)\}/g,'√<span class="rt">$1</span>').replace(/\\sqrt(\d+)/g,'√<span class="rt">$1</span>');
  return s.replace(/\$([^$]+)\$/g,(m,x)=>'<span class="m">'+x.replace(/\[([^\]\/]+)\/([^\]]+)\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>')+'</span>');
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parseNum(v){
  if(v==null)return NaN;
  let s=String(v).trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".").replace(/\s+/g,"").replace(/−/g,"-");
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");
  s=s.replace(/,/g,".");
  const f=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(f)return parseFloat(f[1])/parseFloat(f[2]);
  return /^-?\d+(\.\d+)?$|^-?\.\d+$/.test(s)?parseFloat(s):NaN;
}
function isRight(q,ans){
  if(ans==null||ans==="")return false;
  if(q.k==="mc")return ans===q.a;
  const n=parseNum(ans);return !isNaN(n)&&Math.abs(n-q.a)<=(q.tol||1e-6*Math.max(1,Math.abs(q.a))+0.001);
}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ALL=EXAMS.flatMap((e,ei)=>e.qs.map((q,qi)=>({...q,id:ei+"-"+qi})));
function prep(list){return list.map(q=>{const c={...q};if(q.k==="mc"){const ord=shuffle(q.o.map((_,i)=>i));c.o=ord.map(i=>q.o[i]);c.a=ord.indexOf(q.a||0)}return c})}
function randomExam(part){
  const out=[];
  PARTS[part].topics.forEach(t=>{
    const pool=ALL.filter(q=>q.t===t);
    const pick=(l,n)=>shuffle(pool.filter(q=>q.l===l)).slice(0,n);
    out.push(...pick(1,2),...pick(2,2),...pick(3,1));
  });
  return out;
}

/* ---------- state ---------- */
const app=document.getElementById("app");
let S=null; // {key,name,qs,ans,cur,start,end}
let timerId=null;
function save(){if(S)store.set("psy11-exam-cur",S)}

function start(key){
  let name,list;
  if(key==="rand"){name="امتحان عشوائيّ";list=randomExam(0)}
  else if(key==="rand2"){name="امتحان عشوائيّ – الجزء الثاني";list=randomExam(1)}
  else if(key==="retry"){name="تدريب على الأخطاء";list=S.retry}
  else {const i=+key;name=EXAMS[i].name;list=EXAMS[i].qs.map((q,qi)=>({...q,id:i+"-"+qi}))}
  S={key,name,qs:prep(list.map(q=>{const src=ALL.find(x=>x.id===q.id)||q;return src})),ans:[],cur:0,start:Date.now(),end:null};
  S.ans=new Array(S.qs.length).fill(null);
  save();renderExam();
}

  PARTS.forEach(P=>{
    h+=`<section class="part"><h2>${P.name}</h2><p class="muted" style="margin:2px 0 8px">حسب ${P.src}</p>
      <ul class="topics" style="margin-bottom:14px">${P.topics.map(t=>`<li>${TOPICS[t]}</li>`).join("")}</ul><div class="cards">`;
    P.exams.forEach(i=>{
      const e=EXAMS[i];const [a,b,c]=lvCount(e.qs);
      h+=`<article class="card"><h3>${e.name}</h3>
        <div class="meta">${e.qs.length} سؤالًا · 5 أسئلة من كلّ موضوع</div>
        <div class="levels"><span class="lv l1">سهل ${a}</span><span class="lv l2">متوسّط ${b}</span><span class="lv l3">متقدّم ${c}</span></div>
        <div class="last">${lastTxt(hist[i])}</div>
        <button class="btn" data-start="${i}">ابدأوا الامتحان</button></article>`;
    });
    h+=`<article class="card rand"><h3>امتحان عشوائيّ</h3>
        <div class="meta">30 سؤالًا مختارة عشوائيًّا من كلّ الامتحانات · في كلّ مرّة امتحان مختلف</div>
        <div class="levels"><span class="lv l1">سهل 12</span><span class="lv l2">متوسّط 12</span><span class="lv l3">متقدّم 6</span></div>
        <div class="last">${lastTxt(hist[P.rand])}</div>
        <button class="btn" data-start="${P.rand}">ابدأوا الامتحان</button></article></div></section>`;
  });
  h+=`<div class="howto"><b>تعليمات:</b><ul>
    <li>في أسئلة الاختيار اضغطوا على الإجابة الصحيحة. في الأسئلة التي تطلب عددًا اكتبوا العدد فقط (مثلًا 116).</li>
    <li>يمكنكم التنقّل بين الأسئلة وتغيير الإجابات حتّى تضغطوا على "إنهاء الامتحان".</li>
    <li>اقرأوا كلّ سؤال حتّى النهاية وكلّ الإجابات قبل أن تختاروا.</li></ul></div>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>start(b.dataset.start));
  const r=document.getElementById("resume");if(r)r.onclick=()=>{S=resume;renderExam()};
  window.scrollTo(0,0);
}

/* ---------- exam ---------- */
function elapsed(){const s=Math.floor(((S.end||Date.now())-S.start)/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderExam(confirmOpen){
  const q=S.qs[S.cur],n=S.qs.length,done=S.ans.filter(a=>a!==null&&a!=="").length;
  let body;
  if(q.k==="mc"){
    body=`<div class="opts" role="radiogroup">${q.o.map((o,i)=>`<button class="opt${S.ans[S.cur]===i?" sel":""}" role="radio" aria-checked="${S.ans[S.cur]===i}" data-o="${i}"><span class="dot"></span><span>${fmt(o)}</span></button>`).join("")}</div>`;
  }else{
    body=`<div class="numrow"><label for="numin" class="muted">الإجابة:</label><input id="numin" inputmode="decimal" autocomplete="off" value="${S.ans[S.cur]??""}">${q.u?`<span>${q.u}</span>`:""}</div><div class="hint">اكتبوا عددًا فقط.</div>`;
  }
  app.innerHTML=`<div class="bar"><span class="title">${S.name}</span><span class="timer" id="tm">⏱ ${elapsed()}</span></div>
  <div class="progress"><div style="width:${done/n*100}%"></div></div>
  <section class="sheet">
    <div class="qhead"><span class="qnum">سؤال ${S.cur+1} من ${n}</span><span>·</span><span>${TOPICS[q.t]}</span><span class="lv l${q.l}">${LEVELS[q.l]}</span></div>
    <p class="qtext">${fmt(q.q)}</p>${body}
    <div class="nav">
      <button class="btn ghost" id="prev" ${S.cur===0?"disabled":""}>→ السابق</button>
      ${S.cur<n-1?`<button class="btn" id="next">التالي ←</button>`:`<button class="btn" id="finish">إنهاء الامتحان</button>`}
    </div>
    ${confirmOpen?`<div class="confirm"><div>بقي <b>${n-done}</b> أسئلة بدون إجابة. سؤال بدون إجابة يُحسب كخطأ. هل تريدون الإنهاء؟</div>
      <div class="row"><button class="btn" id="yes">نعم، أنهوا الامتحان</button><button class="btn ghost" id="no">لا، أريد المتابعة</button></div></div>`:""}
  </section>
  <div class="grid" aria-label="الأسئلة">${S.qs.map((_,i)=>`<button data-go="${i}" class="${S.ans[i]!==null&&S.ans[i]!==""?"done":""}${i===S.cur?" cur":""}">${i+1}</button>`).join("")}</div>
  <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="finish2">إنهاء الامتحان</button><button class="btn ghost" id="home">إلى القائمة الرئيسيّة</button></div>`;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{S.ans[S.cur]=+b.dataset.o;save();renderExam()});
  const inp=document.getElementById("numin");
  if(inp){inp.oninput=()=>{S.ans[S.cur]=inp.value.trim()===""?null:inp.value.trim();save();
      const d=S.qs.map((_,i)=>S.ans[i]!==null&&S.ans[i]!=="");app.querySelectorAll("[data-go]").forEach((g,i)=>g.classList.toggle("done",d[i]));
      app.querySelector(".progress>div").style.width=d.filter(Boolean).length/n*100+"%"};
    inp.onkeydown=e=>{if(e.key==="Enter"&&S.cur<n-1){S.cur++;save();renderExam()}};
    if(window.matchMedia("(pointer:fine)").matches)inp.focus();}
  const go=i=>{S.cur=i;save();renderExam()};
  document.getElementById("prev").onclick=()=>go(S.cur-1);
  const nx=document.getElementById("next");if(nx)nx.onclick=()=>go(S.cur+1);
  const tryFinish=()=>{if(S.ans.some(a=>a===null||a===""))renderExam(true);else finish()};
  const f=document.getElementById("finish");if(f)f.onclick=tryFinish;
  document.getElementById("finish2").onclick=tryFinish;
  const y=document.getElementById("yes");if(y)y.onclick=finish;
  const no=document.getElementById("no");if(no)no.onclick=()=>renderExam();
  document.getElementById("home").onclick=renderHome;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  clearInterval(timerId);timerId=setInterval(()=>{const t=document.getElementById("tm");if(t)t.textContent="⏱ "+elapsed()},1000);
}

/* ---------- results ---------- */
function gradeText(p){return p>=90?"ممتاز!":p>=80?"جيّد جدًّا":p>=70?"جيّد":p>=55?"مقبول":"يحتاج إلى تدريب إضافيّ"}
function colorFor(p){return p>=80?"var(--ok)":p>=55?"var(--warn)":"var(--bad)"}
function finish(){
  S.end=Date.now();
  const right=S.qs.map((q,i)=>isRight(q,S.ans[i]));
  const score=Math.round(right.filter(Boolean).length/S.qs.length*100);
  if(S.key!=="retry"){const h=store.get("psy11-exam-hist")||{};h[S.key]={score,date:new Date().toLocaleDateString("ar-EG",{day:"numeric",month:"numeric"})};store.set("psy11-exam-hist",h)}
  store.del("psy11-exam-cur");
  renderResults("all");
}
function ansText(q,a){if(a===null||a==="")return "لم تتمّ الإجابة";return q.k==="mc"?fmt(q.o[a]):'<span class="m">'+String(a).replace(/</g,"&lt;")+'</span>'+(q.u?" "+q.u:"")}
function renderResults(filter){
  clearInterval(timerId);
  const right=S.qs.map((q,i)=>isRight(q,S.ans[i]));
  const nr=right.filter(Boolean).length,n=S.qs.length,score=Math.round(nr/n*100);
  const rows=(keys,label,getK)=>keys.map(k=>{const idx=S.qs.map((q,i)=>i).filter(i=>getK(S.qs[i])===k);if(!idx.length)return "";
      const c=idx.filter(i=>right[i]).length,p=Math.round(c/idx.length*100);
      return `<div class="tb"><span>${label(k)}</span><span class="v">${c}/${idx.length}</span><div class="track"><div style="width:${p}%;background:${colorFor(p)}"></div></div></div>`}).join("");
  const weak=TOPICS.map((t,k)=>{const idx=S.qs.map((q,i)=>i).filter(i=>S.qs[i].t===k);const c=idx.filter(i=>right[i]).length;return {t,k,p:idx.length?c/idx.length:1,len:idx.length}}).filter(x=>x.len&&x.p<0.6);
  let list=S.qs.map((q,i)=>({q,i,ok:right[i]}));
  if(filter==="wrong")list=list.filter(x=>!x.ok);
  const deg=score*3.6;
  app.innerHTML=`<div class="bar"><span class="title">النتائج: ${S.name}</span><span class="timer">⏱ ${elapsed()}</span></div>
  <section class="score">
    <div class="ring" style="background:conic-gradient(${colorFor(score)} ${deg}deg, var(--line) 0)"><div style="width:104px;height:104px;border-radius:50%;background:var(--paper);display:grid;place-items:center"><div><b>${score}</b><small>من 100</small></div></div></div>
    <div><div class="grade">${gradeText(score)}</div>
      <p style="margin:6px 0 0">أجبتم إجابة صحيحة عن <b>${nr}</b> من ${n} أسئلة.</p>
      ${weak.length?`<p class="muted" style="margin:6px 0 0">يُنصح بمراجعة: ${weak.map(w=>w.t).join("، ")}.</p>`:`<p class="muted" style="margin:6px 0 0">أداء جيّد في كلّ المواضيع.</p>`}
    </div>
  </section>
  <div class="breakdown">
    <div class="panel"><h3>حسب الموضوع</h3>${rows(TOPICS.map((_,i)=>i),k=>TOPICS[k],q=>q.t)}</div>
    <div class="panel"><h3>حسب المستوى</h3>${rows([1,2,3],k=>LEVELS[k],q=>q.l)}</div>
  </div>
  <div class="actions">
    ${nr<n?`<button class="btn" id="retry">تدرّبوا على الأسئلة الخاطئة (${n-nr})</button>`:""}
    <button class="btn ghost" id="again">امتحان جديد</button>
  </div>
  <h2>الحلول والإجابات</h2>
  <div class="filter"><button data-f="all" class="${filter==="all"?"on":""}">كلّ الأسئلة (${n})</button><button data-f="wrong" class="${filter==="wrong"?"on":""}">الأخطاء فقط (${n-nr})</button></div>
  <div class="rev">${list.map(({q,i,ok})=>`<article class="ri${ok?"":" x"}">
    <div class="qhead"><span class="qnum">${ok?"✓":"✗"} سؤال ${i+1}</span><span>·</span><span>${TOPICS[q.t]}</span><span class="lv l${q.l}">${LEVELS[q.l]}</span></div>
    <p class="qt">${fmt(q.q)}</p>
    <div class="ans"><div class="you ${ok?"good":"bad"}">إجابتكم: ${ansText(q,S.ans[i])}</div>${ok?"":`<div>الإجابة الصحيحة: <b>${q.k==="mc"?fmt(q.o[q.a]):'<span class="m">'+q.a+'</span>'+(q.u?" "+q.u:"")}</b></div>`}</div>
    <div class="sol"><b>الحلّ:</b> ${fmt(q.s)}</div></article>`).join("")||'<p class="muted">لا توجد أخطاء. أحسنتم!</p>'}</div>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>renderResults(b.dataset.f));
  const r=document.getElementById("retry");if(r)r.onclick=()=>{S.retry=S.qs.filter((q,i)=>!right[i]);start("retry")};
  document.getElementById("again").onclick=renderHome;
  if(filter==="all")window.scrollTo(0,0);
}

renderHome();
</script>
